
name: Opsfeed CI/CD

on:
  pull_request:
    paths:
      - "infra/**"
      - "services/**"
      - ".github/workflows/**"

  push:
    branches:
      - main
    paths:
      - "infra/**"
      - "services/**"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: opsfeed-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run ingestion tests
        run: python -m unittest discover -s services/ingest/tests -v

  
  validate:
    name: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.9"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra/

      - name: Initialize Terraform
        working-directory: infra/environments/dev
        run: terraform init -backend=false

      - name: Validate Terraform
        working-directory: infra/environments/dev
        run: terraform validate
  

  aws-oidc:
    name: aws-oidc
    runs-on: ubuntu-latest

    # This role trusts pull-request workflows.
    if: github.event_name == 'pull_request'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Inspect OIDC claims (without printing token)
        shell: bash
        run: |
          TOKEN="$(curl -sS \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"

          python - "$TOKEN" <<'PY'
          import base64
          import json
          import sys

          token = sys.argv[1]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          for key in ("iss", "aud", "sub"):
              print(f"{key}: {claims.get(key)}")
          PY 
               
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: opsfeed-github-actions

      - name: Verify AWS identity
        run: aws sts get-caller-identity
