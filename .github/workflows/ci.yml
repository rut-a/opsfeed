
name: Opsfeed CI/CD

on:
  pull_request:
    branches:
      - main
    paths:
      - "infra/**"
      - "services/**"
      - ".github/workflows/**"

  push:
    branches:
      - main
    paths:
      - "infra/**"
      - "services/**"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: opsfeed-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run ingestion tests
        run: python -m unittest discover -s services/ingest/tests -v

  
  validate:
    name: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.9"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra/

      - name: Initialize Terraform
        working-directory: infra/environments/dev
        run: terraform init -backend=false

      - name: Validate Terraform
        working-directory: infra/environments/dev
        run: terraform validate
  

  aws-oidc:
    name: aws-oidc
    runs-on: ubuntu-latest

    # This role trusts pull-request workflows.
    if: github.event_name == 'pull_request'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: opsfeed-github-actions

      - name: Verify AWS identity
        run: aws sts get-caller-identity

  terraform-plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    needs: [test, validate]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository


    permissions:
      contents: read
      id-token: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.9"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: opsfeed-terraform-plan

      - name: Initialize Terraform
        working-directory: infra/environments/dev
        run: terraform init

      - name: Create Terraform plan
        id: plan
        working-directory: infra/environments/dev
        shell: bash
        run: |
          terraform plan -no-color -out=tfplan
          terraform show -json tfplan > plan.json

          ADDED=$(jq '[.resource_changes[]? | select(.change.actions == ["create"])] | length' plan.json)
          CHANGED=$(jq '[.resource_changes[]? | select(.change.actions == ["update"] or .change.actions == ["delete", "create"] or .change.actions == ["create", "delete"])] | length' plan.json)
          DESTROYED=$(jq '[.resource_changes[]? | select(.change.actions == ["delete"])] | length' plan.json)

          {
            echo "summary<<EOF"
            echo "### Terraform plan"
            echo ""
            echo "| Add | Change/replace | Destroy |"
            echo "|---:|---:|---:|"
            echo "| ${ADDED} | ${CHANGED} | ${DESTROYED} |"
            echo ""
            echo "Full plan details are available in the **Terraform plan** Actions job log."
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Comment Terraform plan on PR
        uses: actions/github-script@v7
        env:
          PLAN_SUMMARY: ${{ steps.plan.outputs.summary }}
        with:
          script: |
            const marker = '<!-- opsfeed-terraform-plan -->';
            const body = `${marker}\n${process.env.PLAN_SUMMARY}`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
            });

            const existing = comments.data.find(comment =>
              comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
