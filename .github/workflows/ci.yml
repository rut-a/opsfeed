
name: Opsfeed CI/CD

on:
  pull_request:
    paths:
      - "infra/**"
      - "services/**"
      - ".github/workflows/**"

  push:
    branches:
      - main
    paths:
      - "infra/**"
      - "services/**"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: opsfeed-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run ingestion tests
        run: python -m unittest discover -s services/ingest/tests -v
